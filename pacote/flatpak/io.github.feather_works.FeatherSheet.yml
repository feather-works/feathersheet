app-id: io.github.feather_works.FeatherSheet
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: feathersheet
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Abre e salva planilhas em qualquer pasta, e lê arquivos vinculados (=[outro.xlsx]...).
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  # Vínculos e macros que buscam dados na rede.
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/feathersheet/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: feathersheet
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --manifest-path crates/feathersheet/Cargo.toml
      - install -Dm755 crates/feathersheet/target/release/feathersheet -t /app/bin
      - install -Dm644 pacote/feathersheet.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 pacote/feathersheet-mime.xml /app/share/mime/packages/${FLATPAK_ID}.xml
      - install -Dm644 pacote/icones/feathersheet.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - for t in 16 24 32 48 64 128 256 512; do install -Dm644 pacote/icones/feathersheet-$t.png /app/share/icons/hicolor/${t}x${t}/apps/${FLATPAK_ID}.png; done
      - install -Dm644 pacote/flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
    sources:
      # Na submissão ao Flathub: a tag da versão (tag: vX.Y.Z) com o commit dela.
      - type: git
        url: https://github.com/feather-works/feathersheet.git
        commit: bf924a05d4f92992cbc09507fdff4af032b27e0b
      - cargo-sources.json

[package]
name = "feathersheet"
version = "0.2.1"
edition = "2021"
description = "FeatherSheet: planilha nativa em Rust (interface no pelicano)"

[[bin]]
name = "feathersheet"
path = "src/main.rs"

[dependencies]
pelicano = { git = "https://github.com/feather-works/pelicano.git", tag = "v0.1.19", features = ["highlighter"] }
# Idioma do sistema na primeira abertura (já vinha como dependência indireta).
sys-locale = "0.3"
feather-charts = { git = "https://github.com/feather-works/feather-charts", tag = "v0.3.4" }
feather-ui = { git = "https://github.com/feather-works/feather-ui.git", tag = "v0.3.8" }
feather-draw = { git = "https://github.com/feather-works/feather-draw", tag = "v0.1.1" }
# Formas, ícones e SmartArt comuns da suíte (camada de objetos soltos, app/objetos).
feather-shapes = { git = "https://github.com/feather-works/feather-shapes", tag = "v0.1.2" }
# Efeitos RGBA compartilhados com FeatherDocs; codecs ficam na GUI.
feather-image = { git = "https://github.com/feather-works/feather-io", tag = "v0.2.0" }
base64 = "0.22"
# Senha da proteção de planilha: o hash SHA-512 com sal do Excel (protecao_ui.rs).
sha2 = "0.10"
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Apenas representacao/algoritmos de borda no Canvas; engine colunar permanece no core.
feather-tables = { git = "https://github.com/feather-works/feather-io", tag = "v0.2.0" }
feathersheet-core = { path = "../feathersheet-core" }
feathersheet-io = { path = "../feathersheet-io" }
# Macros no motor Falcão (27/10/2026): a macro do vídeo cai de ~30 s (Boa) para ~9 s.
feathersheet-macros = { path = "../feathersheet-macros", features = ["falcao"] }
# Leitor de .xlsm: VBA do Excel convertido para as macros em JavaScript.
feathersheet-vba = { path = "../feathersheet-vba" }
# MCP ao vivo: as ferramentas da IA agem na planilha da tela (canal local, sem rede).
feathersheet-mcp = { path = "../feathersheet-mcp" }
feather-macros = { git = "https://github.com/feather-works/feather-io", tag = "v0.2.0" }
# Rasterizar o gráfico uma vez e recortar a imagem na rolagem (o canvas não
# recorta SVG). A mesma versão e recursos que o Iced já usa: nada novo compila.
resvg = { version = "0.42", default-features = false, features = ["text"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
# Colar imagem da area de transferencia (print). Rust puro; wayland-data-control
# cobre GNOME/Wayland sem libs C. iced::clipboard so le texto.
arboard = { version = "3.6", features = ["wayland-data-control"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fontes Web/API: HTTP(S) com TLS, tempo limite e corpo limitado.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Extrai tabelas HTML estáticas de páginas Web (sem executar JavaScript).
scraper = "0.22"
# Inspeciona o tamanho descomprimido do XLSX antes do importador OpenQuery.
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Medições de tempo (`cargo test --profile medir`): otimizado como o release,
# mas sem LTO e com compilação incremental — recompila em segundos, não em
# 6 minutos. Os números ficam próximos dos do release, não idênticos.
[profile.medir]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

# Só a ligação com a libc do sistema (que o Rust já usa): `malloc_trim`
# devolve ao sistema a memória que uma operação grande já soltou.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1
# Só as linhas (o backtrace continua útil): com a depuração completa, o
# target/debug passou de 100 GB (15/10/2026).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3


[build-dependencies]
# Ícone e nome do .exe do Windows (build.rs).
embed-resource = "3"

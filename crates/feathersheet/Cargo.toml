[package]
name = "feathersheet"
version = "0.3.2"
edition = "2021"
description = "FeatherSheet: planilha nativa em Rust (interface no pelicano)"

[[bin]]
name = "feathersheet"
path = "src/main.rs"

[dependencies]
# pelicano do crates.io; a 0.1.30 trouxe o align_x do campo de texto (#90), a 0.1.33 a letra padrão (Feather Sans),
# a 0.1.34 a janela desenhada pela CPU em placa sem Vulkan/OpenGL utilizável (#163).
pelicano = { version = "0.1.34", features = ["highlighter"] }
# Idioma do sistema na primeira abertura (já vinha como dependência indireta).
sys-locale = "0.3"
feather-charts = { git = "https://github.com/feather-works/feather-charts", tag = "v0.3.5" }
feather-ui = { git = "https://github.com/feather-works/feather-ui.git", tag = "v0.3.16" }
feather-draw = { git = "https://github.com/feather-works/feather-draw", tag = "v0.1.1" }
# Formas, ícones e SmartArt comuns da suíte (camada de objetos soltos, app/objetos).
feather-shapes = { git = "https://github.com/feather-works/feather-shapes", tag = "v0.1.2" }
# Efeitos RGBA compartilhados com FeatherDocs; codecs ficam na GUI.
feather-image = { git = "https://github.com/feather-works/feather-io", tag = "v0.2.1" }
base64 = "0.22"
# Senha da proteção de planilha: o hash SHA-512 com sal do Excel (protecao_ui.rs).
sha2 = "0.10"
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Apenas representacao/algoritmos de borda no Canvas; engine colunar permanece no core.
feather-tables = { git = "https://github.com/feather-works/feather-io", tag = "v0.2.1" }
feathersheet-core = { path = "../feathersheet-core" }
feathersheet-io = { path = "../feathersheet-io" }
# Macros no motor Falcão (27/10/2026): a macro do vídeo cai de ~30 s (Boa) para ~9 s.
feathersheet-macros = { path = "../feathersheet-macros", features = ["falcao"] }
# Leitor de .xlsm: VBA do Excel convertido para as macros em JavaScript.
feathersheet-vba = { path = "../feathersheet-vba" }
# MCP ao vivo: as ferramentas da IA agem na planilha da tela (canal local, sem rede).
feathersheet-mcp = { path = "../feathersheet-mcp" }
feather-macros = { git = "https://github.com/feather-works/feather-io", tag = "v0.2.1" }
# Rasterizar o gráfico uma vez e recortar a imagem na rolagem (o canvas não
# recorta SVG). A mesma versão e recursos que o Iced já usa: nada novo compila.
resvg = { version = "0.42", default-features = false, features = ["text"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "net"] }
# Colar imagem da area de transferencia (print). Rust puro; wayland-data-control
# cobre GNOME/Wayland sem libs C. iced::clipboard so le texto.
arboard = { version = "3.6", features = ["wayland-data-control"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Fontes Web/API: HTTP(S) com TLS, tempo limite e corpo limitado.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# Extrai tabelas HTML estáticas de páginas Web (sem executar JavaScript).
scraper = "0.22"
# FeatherQuery ▸ Banco de dados PostgreSQL (#70): o mesmo driver do FeatherDB, Rust puro, TLS com o rustls
# que o reqwest já traz.
postgres = "0.19"
tokio-postgres-rustls = "0.13"
mysql = { version = "26", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
# SQL Server: Rust puro, TLS pelo rustls (o padrão traz native-tls/OpenSSL); datas pelo chrono.
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
chrono = { version = "0.4", default-features = false }
tokio-util = { version = "0.7", features = ["compat"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Senha lembrada no cofre do sistema. Secret Service pelo zbus (Rust puro, já vem pelo rfd), não pela libdbus.
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust", "windows-native", "apple-native"] }
# Inspeciona o tamanho descomprimido do XLSX antes do importador OpenQuery.
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Medições de tempo (`cargo test --profile medir`): otimizado como o release,
# mas sem LTO e com compilação incremental — recompila em segundos, não em
# 6 minutos. Os números ficam próximos dos do release, não idênticos.
[profile.medir]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

# Só a ligação com a libc do sistema (que o Rust já usa): `malloc_trim`
# devolve ao sistema a memória que uma operação grande já soltou, e o fuso
# de AGORA()/HOJE() vem do `localtime_r` (Linux e macOS; sem ela o macOS não compilava).
[target.'cfg(any(all(target_os = "linux", target_env = "gnu"), target_os = "macos"))'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 1
# Só as linhas (o backtrace continua útil): com a depuração completa, o
# target/debug passou de 100 GB (15/10/2026).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3


[build-dependencies]
# Ícone e nome do .exe do Windows (build.rs).
embed-resource = "3"

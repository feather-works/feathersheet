[package]
name = "feathersheet-mcp"
version = "0.0.2"
edition = "2021"
description = "Servidor MCP do FeatherSheet: deixa uma IA ler, escrever e conferir planilhas, tudo local (stdio)."

# Só Rust puro e nada de rede: o servidor fala com quem o abriu por stdin/stdout e, com o
# aplicativo aberto, por um canal local da máquina. Nenhum dado da planilha sai dela (regra 5).
[dependencies]
feathersheet-core = { path = "../feathersheet-core" }
feathersheet-io = { path = "../feathersheet-io" }
feathersheet-macros = { path = "../feathersheet-macros" }
feather-macros = { git = "https://github.com/feather-works/feather-io", tag = "v0.1.4" }
serde_json = "1"

[lib]
name = "feathersheet_mcp"
path = "src/lib.rs"

[[bin]]
name = "feathersheet-mcp"
path = "src/main.rs"

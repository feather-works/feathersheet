[package]
name = "feathersheet-macros"
version = "0.0.2"
edition = "2021"
description = "Execução local de macros JavaScript no motor Falcão (ou no Boa, sem a opção falcao)"

[dependencies]
feather-macros = { git = "https://github.com/feather-works/feather-io", tag = "v0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
feathersheet-core = { path = "../feathersheet-core" }

[features]
default = ["falcao"]
# Macros no motor Falcão (padrão desde a v0.2.0); sem ela, no Boa.
falcao = ["feather-macros/falcao"]

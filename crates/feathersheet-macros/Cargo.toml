[package]
name = "feathersheet-macros"
version = "0.0.2"
edition = "2021"
description = "Execução local de macros JavaScript no interpretador Rust Boa"

[dependencies]
feather-macros = { git = "https://github.com/feather-works/feather-io", tag = "v0.1.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
feathersheet-core = { path = "../feathersheet-core" }

# shortcut: [patch] provisório (Limites do feather-macros, 27/10/2026); trocar pela tag nova do feather-io antes de lançar.
[patch."https://github.com/feather-works/feather-io"]
feather-macros = { path = "../../../feather-io/crates/feather-macros" }
